# foot — the session terminal (Super+Shift+Return)
#
# The built-in default (11.5pt) is physically small on this 1920x1200 14"
# panel. 14pt is ~19 px per line, in line with how the rest of the desktop
# reads. The size is in points, scaled by the output's scale factor.
#
# A running terminal zooms with ctrl+= / ctrl+- and resets with ctrl+0;
# that zoom is per-window and is not saved, so change `size` here for the
# default.
[main]
font=monospace:size=14
