# gtklock configuration for river-classic.
#
# lock-session.sh uses gtklock by default because it is the only installed
# locker that renders a *live* clock/date. (swaylock 1.8 removed its clock;
# force it with RIVER_LOCKER=swaylock, where the clock is baked into the image.)
[main]
# Live clock + date, matching the generated-image design.
time-format=%H:%M
date-format=%A, %d %B
# Resume the kanata/gestures grabs after unlocking. The wrapper also passes
# this on the command line; keeping it here means a hand-run `gtklock -c` is
# equally safe.
unlock-command=/bin/sh -c 'exec "$HOME/.config/river/input-session.sh" resume'
# The power bar: icon-only, joined, so it stays out of the way of the clock.
# Comment this line out for a bare clock+password screen; the Switch User
# action is also in the System Menu / keyboard-only menu / power menu.
modules=powerbar-module.so

[powerbar]
show-labels=false
linked-buttons=true

# The module runs this with g_spawn_command_line_async(), which does not expand
# shell variables itself.  /bin/sh expands $HOME, so the path stays portable.
# switch-user.sh pauses kanata/gestures before GDM takes the seat; returning to
# the session resumes them (watcher + unlock command).
userswitch-command=/bin/sh -c 'exec "$HOME/.config/river/switch-user.sh"'

# Deliberately no logout button: Switch User is the non-destructive action.
# Ending the river session (and running the cross-session cleanup) stays on
# Super+Shift+E / GDM's Log Out.
logout-command=
