# gtklock configuration for river-classic.
#
# lock-session.sh passes this file with --config.  The powerbar module is the
# only module loaded: it adds the lock-screen buttons without pulling in the
# user-info/avatar module.
[main]
modules=powerbar-module.so
# Run when the user lets the session back in: input-session.sh restarts the
# kanata + gestures.py grabs that Switch User released (and is a no-op when
# they are already running, so a plain lock→unlock cycle is unaffected).
unlock-command=/bin/sh -c 'exec "$HOME/.config/river/input-session.sh" resume'

[powerbar]
# Labels make "Switch user" explicit instead of relying on the icon alone.
show-labels=true
linked-buttons=true

# The module runs this with g_spawn_command_line_async(), which does not expand
# shell variables itself.  /bin/sh expands $HOME, so the path stays portable.
# switch-user.sh pauses kanata/gestures before GDM takes the seat; the unlock
# command in lock-session.sh resumes them when this session is unlocked again.
userswitch-command=/bin/sh -c 'exec "$HOME/.config/river/switch-user.sh"'

# Deliberately no logout button: Switch User is the non-destructive action.
# Ending the river session (and running the cross-session cleanup) stays on
# Super+Shift+E / GDM's Log Out.  Leaving this empty means the module does not
# create a logout button.
logout-command=
