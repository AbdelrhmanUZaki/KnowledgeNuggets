# fuzzel launcher theme - river-classic.
# Matches the clipboard picker (config/river/clipboard-preview.py):
# catppuccin-mocha-ish dark palette, rounded corners, blue border.
# Linked to ~/.config/fuzzel/fuzzel.ini by restore.sh.

[main]
font=Ubuntu:size=15
lines=12
horizontal-pad=18
vertical-pad=14
inner-pad=10

[colors]
background=1e1e2eee
text=cdd6f4ff
prompt=89b4faff
placeholder=6c7086ff
input=cdd6f4ff
match=f9e2afff
selection=45475aff
selection-text=ffffffff
selection-match=f9e2afff
counter=6c7086ff
border=89b4faff

[border]
width=2
radius=14
