# ~/.tmux.conf - Linux (managed by 2-setup/linux/restore.sh)

# Vim keybindings in command line editing
set-option -g default-command "bash -c 'set -o vi; exec bash'"

# Mouse support for interacting with panes
set -g mouse on

# Start panes/windows numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# System clipboard integration (X11)
set -g set-clipboard on
set -g copy-command "xclip -selection clipboard -in"

# vi mode keys + copy to clipboard
set -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"